name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Checkout repository code
  checks: write # Publish test results via dorny/test-reporter
  pull-requests: write # Comment test results on PRs

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (type-check, lint, bundle)
        run: npm run compile

  package:
    name: Package VSIX
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Package VSIX (date version)
        shell: bash
        run: |
          DATE_VER="0.0.0-dev$(date +%Y%m%d%H%M%S)"
          npm run package:vsix -- --no-git-tag-version --ignoreFile .vscodeignore-dev "$DATE_VER"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            *.vsix
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    needs: compile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test -- --reporter json --vscode-test-output test-results.json

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test -- --reporter json --vscode-test-output test-results.json

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results (${{ runner.os }})
          path: test-results.json
          reporter: mocha-json

      - name: Upload test artifacts (out)
        uses: actions/upload-artifact@v4
        with:
          name: test-out-${{ runner.os }}-${{ github.run_id }}
          path: |
            out/**
          if-no-files-found: warn
          retention-days: 14
