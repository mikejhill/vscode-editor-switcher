name: Release Common

on:
  workflow_call:
    inputs:
      version:
        description: "Version or tag name (e.g., v1.0.0)"
        required: true
        type: string
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
      vsix:
        description: "VSIX filename for the packaged extension"
        value: ${{ jobs.build.outputs.vsix }}
      release-notes:
        description: "Path to generated release notes from CHANGELOG"
        value: ${{ jobs.build.outputs.release-notes }}
      version:
        description: "Extracted version number (without 'v' prefix)"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.outputs.outputs.artifact-name }}
      vsix: ${{ steps.outputs.outputs.vsix }}
      release-notes: ${{ steps.outputs.outputs.release-notes }}
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (type-check, lint, bundle)
        run: npm run compile

      - name: Production build
        run: npm run package

      - name: Prepare CHANGELOG and release notes
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          TAG="$VERSION_INPUT"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Version input is empty after stripping leading 'v'" >&2
            exit 1
          fi
          export VERSION
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          if (!version) {
            console.error('VERSION is not set');
            process.exit(1);
          }
          const md = fs.readFileSync('CHANGELOG.md','utf8');

          // Find version section for release notes
          const header = `## [${version}]`;
          const start = md.indexOf(header);
          if (start === -1) {
            console.error(`CHANGELOG.md is missing section: ${header}`);
            process.exit(1);
          }
          const next = md.indexOf('\n## [', start + header.length);
          const end = next === -1 ? md.length : next;
          const notes = md.slice(start, end).trim();
          if (!notes) {
            console.error(`CHANGELOG.md section ${header} is empty`);
            process.exit(1);
          }
          fs.writeFileSync('RELEASE_NOTES.md', notes);

          // Write CHANGELOG_RELEASE.md: from version header to end of file
          if (start === -1) {
            console.error(`CHANGELOG.md is missing section: ${header}`);
            process.exit(1);
          }
          const changelogRelease = md.slice(start).trimStart();
          fs.writeFileSync('CHANGELOG_RELEASE.md', changelogRelease);
          NODE

      - name: Package VSIX
        run: npm run package:vsix -- --no-git-tag-version --changelog-path CHANGELOG_RELEASE.md ${{ inputs.version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.version }}
          path: |
            *.vsix
            RELEASE_NOTES.md
          retention-days: 30

      - name: Set outputs
        id: outputs
        run: |
          echo "artifact-name=build-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          VSIX_FILE=$(ls *.vsix)
          echo "vsix=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "release-notes=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
