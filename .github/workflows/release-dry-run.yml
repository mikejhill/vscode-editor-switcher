name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to simulate (e.g., v1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release-common.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  dry-run:
    name: Validate Dry Run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs['artifact-name'] }}

      - name: Validate VSCE_PAT token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "❌ VSCE_PAT secret is not set" >&2
            exit 1
          fi
          npm install -g @vscode/vsce
          if vsce verify-pat --pat "$VSCE_PAT"; then
            echo "✅ VSCE_PAT is valid and can publish to marketplace"
          else
            echo "❌ VSCE_PAT is invalid or cannot be verified" >&2
            exit 1
          fi

      - name: Validate release permissions and notes generation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.version }}
        run: |
          gh api repos/${{ github.repository }} >/dev/null
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG_NAME" \
            -f target_commitish="${GITHUB_SHA}" \
            > /dev/null
          echo "✅ GitHub release permissions verified"

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.version }}
          path: |
            ${{ needs.build.outputs['vsix'] }}
            ${{ needs.build.outputs['release-notes'] }}
          retention-days: 14

      - name: Summarize results
        run: |
          {
            echo "### Release Notes (Dry Run for ${{ inputs.version }})";
            echo "";
            cat "${{ needs.build.outputs['release-notes'] }}";
          } >> "$GITHUB_STEP_SUMMARY"
